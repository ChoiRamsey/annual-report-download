
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연차보고서 다운로드</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            margin: 0;
            padding: 60px 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 35px;
        }

        .download-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-button {
            display: block;
            padding: 16px;
            background-color: #ffffff;
            border: 1px solid #d5d9df;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-button:hover {
            background-color: #f0f4f8;
            border-color: #777;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>연차보고서 다운로드</h1>

        <div class="download-list">

            <a href="https://d3fmuh4wzkbw6v.cloudfront.net/annualreport/2023 복권위원회 연차보고서.pdf"
                class="download-button"
                target="_blank">
                연차보고서 2023
            </a>
            <a href="https://d3fmuh4wzkbw6v.cloudfront.net/annualreport/2025 복권위원회 연차보고서.pdf"
                class="download-button"
                target="_blank">
                연차보고서 2025
            </a>

        </div>

    </div>

</body>
</html>
